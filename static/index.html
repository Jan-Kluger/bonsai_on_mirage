      .about-section > .container {
        position: relative;
        z-index: 1;
        max-width: 1400px;
      }
      
      .about-heading {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 3rem;
        font-weight: 700;
        color: #ffffff;
        margin-bottom: 3rem;
      }
      
      .about-content {
        display: grid;
        grid-template-columns: 200px 1fr;
        gap: 4rem;
        align-items: start;
      }
      
      .profile-photo {
        width: 200px;
        height: 200px;
        border-radius: 50%;
        background: #333333;
        border: 4px solid #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 0.9rem;
      }
      
      .about-text {
        color: #ffffff;
        font-size: 1.1rem;
      }
      
      .about-text p {
        margin-bottom: 1.5rem;
      }
      
      .section-watermark {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: clamp(3rem, 8vw, 5rem);
        font-weight: 700;
        color: #000000;
        letter-spacing: -0.02em;
        white-space: nowrap;
        pointer-events: none;
        user-select: none;
        text-align: center;
        margin-bottom: 2rem;
      }

      /* ========== SECTION 3: PROJECTS ========== */
      .projects-section {
        background: #ffffff;
        padding: 6rem 0 12rem 0;
        position: relative;
        overflow: hidden;
      }
      
      .projects-section > .container {
        position: relative;
        z-index: 1;
      }
      
      .projects-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 2rem;
      }
      
      .project-card {
        background: #f0f0f0;
        border: none;
        border-radius: 0;
        padding: 1.5rem 2rem 8rem 2rem;
        text-align: left;
        cursor: pointer;
        transition: all 0.1s ease;
        font-weight: 700;
        font-size: 1.2rem;
        color: #000000;
        position: relative;
        box-shadow: 12px 12px 0 0 #000000;
      }
      
      /* Right side 3D effect - parallelogram with 45° corners */
      .project-card::before {
        content: '';
        position: absolute;
        top: 0;
        right: -12px;
        width: 12px;
        height: calc(100% + 12px);
        background: #888888;
        clip-path: polygon(0 0, 100% 12px, 100% 100%, 0 calc(100% - 12px));
        transition: all 0.1s ease;
      }
      
      /* Bottom side 3D effect - parallelogram with 45° corners */
      .project-card::after {
        content: '';
        position: absolute;
        bottom: -12px;
        left: 0;
        width: calc(100% + 12px);
        height: 12px;
        background: #000000;
        clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 100%, 12px 100%);
        transition: all 0.1s ease;
      }
      
      .project-card:hover {
        background: #0000ff;
        color: #ffffff;
        transform: translate(6px, 6px);
        box-shadow: 6px 6px 0 0 #000000;
      }
      
      .project-card:hover::before {
        right: -6px;
        width: 6px;
        height: calc(100% + 6px);
        background: #000088;
        clip-path: polygon(0 0, 100% 6px, 100% 100%, 0 calc(100% - 6px));
      }
      
      .project-card:hover::after {
        bottom: -6px;
        width: calc(100% + 6px);
        height: 6px;
        clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 100%, 6px 100%);
      }
      
      .project-card:active {
        transform: translate(12px, 12px);
        box-shadow: none;
      }
      
      .project-card:active::before,
      .project-card:active::after {
        display: none;
      }

      .experience-section > .container {
        position: relative;
        z-index: 1;
      }
      
      .experience-heading {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 3rem;
        font-weight: 700;
        color: #ffffff;
        margin-bottom: 3rem;
      }
      
      .experience-item {
        display: grid;
        grid-template-columns: 200px 1fr;
        gap: 4rem;
        color: #ffffff;
        margin-bottom: 3rem;
      }
      
      .experience-labels {
        font-weight: 600;
      }
      
      .experience-labels p {
        margin-bottom: 0.5rem;
      }
      
      .experience-description {
        font-weight: 400;
        opacity: 0.95;
      }
      
      .experience-description p {
        margin-bottom: 1rem;
      }

      /* ========== PROJECT DETAIL PAGE ========== */
      .project-detail {
        padding: 4rem 0;
        min-height: 100vh;
      }
      
      .back-btn {
        font-family: 'Inter', sans-serif;
        font-size: 0.9rem;
        font-weight: 500;
        background: #f0f0f0;
        color: #333;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.15s ease;
        margin-bottom: 2rem;
      }
      
      .back-btn:hover {
        background: #e5e5e5;
      }
      
      .project-detail h1 {
        font-size: 3rem;
        font-weight: 800;
        color: #0000ff;
        margin-bottom: 1rem;
      }
      
      .project-detail h2 {
        font-size: 1.5rem;
        font-weight: 700;
        color: #1a1a1a;
        margin-top: 2.5rem;
        margin-bottom: 1rem;
      }
      
      .project-detail p {
        color: #555;
        margin-bottom: 1rem;
        max-width: 65ch;
      }
      
      .tech-list {
        list-style: none;
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 1rem;
      }
      
      .tech-list li {
        font-size: 0.9rem;
        font-weight: 500;
        color: #0000ff;
        padding: 0.5rem 1rem;
        background: rgba(0, 0, 255, 0.1);
        border-radius: 6px;
      }

      /* ========== MODAL ========== */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0.7));
        z-index: 9999;
        isolation: isolate;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
        overscroll-behavior: contain;
      }
      
      .modal-overlay.active {
        opacity: 1;
        pointer-events: auto;
        overflow: hidden;
      }
      
      html:has(.modal-overlay.active),
      body:has(.modal-overlay.active) {
        overflow: hidden;
      }
      
      .modal-card {
        isolation: isolate;
        background: #ffffff;
        width: 100%;
        max-width: 1000px;
        height: 90vh;
        overflow: hidden;
        position: relative;
        transform: translateY(100%);
        transition: transform 0.3s ease;
        display: flex;
        flex-direction: column;
      }
      
      .modal-overlay.active .modal-card {
        transform: translateY(0);
      }
      
      .modal-header {
        position: absolute;
        top: 1.5rem;
        left: 1.5rem;
        z-index: 10;
      }
      
      .modal-body {
        flex: 1;
        overflow-y: auto;
        padding: 4rem 5rem;
        overscroll-behavior: contain;
      }
      
      .modal-close {
        position: relative;
        top: 0;
        left: 0;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        font-weight: 700;
        color: #000000;
        background: #f0f0f0;
        cursor: pointer;
        transition: all 0.1s ease;
        box-shadow: 6px 6px 0 0 #000000;
      }
      
      .modal-close::before {
        content: '';
        position: absolute;
        top: 0;
        right: -6px;
        width: 6px;
        height: calc(100% + 6px);
        background: #888888;
        clip-path: polygon(0 0, 100% 6px, 100% 100%, 0 calc(100% - 6px));
        transition: all 0.1s ease;
      }
      
      .modal-close::after {
        content: '';
        position: absolute;
        bottom: -6px;
        left: 0;
        width: calc(100% + 6px);
        height: 6px;
        background: #000000;
        clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 100%, 6px 100%);
        transition: all 0.1s ease;
      }
      
      .modal-close:hover {
        background: #0000ff;
        color: #ffffff;
        transform: translate(3px, 3px);
        box-shadow: 3px 3px 0 0 #000000;
      }
      
      .modal-close:hover::before {
        right: -3px;
        width: 3px;
        height: calc(100% + 3px);
        background: #000088;
        clip-path: polygon(0 0, 100% 3px, 100% 100%, 0 calc(100% - 3px));
      }
      
      .modal-close:hover::after {
        bottom: -3px;
        width: calc(100% + 3px);
        height: 3px;
        clip-path: polygon(0 0, calc(100% - 3px) 0, 100% 100%, 3px 100%);
      }
      
      .modal-close:active {
        transform: translate(6px, 6px);
        box-shadow: none;
      }
      
      .modal-close:active::before,
      .modal-close:active::after {
        display: none;
      }
      
      .modal-title {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 2.5rem;
        font-weight: 700;
        color: #0000ff;
        margin-bottom: 1rem;
      }
      
      .modal-desc {
        color: #555;
        margin-bottom: 2rem;
        font-size: 1.1rem;
      }
      
      .modal-card h3 {
        font-size: 1.3rem;
        font-weight: 700;
        color: #1a1a1a;
        margin-top: 2rem;
        margin-bottom: 0.75rem;
      }
      
      .modal-card p {
        color: #555;
        margin-bottom: 1rem;
      }
      
      .modal-card .tech-list {
        margin-top: 0.5rem;
      }

      /* ========== RESPONSIVE ========== */
      @media (max-width: 768px) {
        .intro-content {
          flex-direction: column;
          gap: 2rem;
        }
        
        .gif-placeholder {
          max-width: 100%;
        }
        
        .about-content {
          grid-template-columns: 1fr;
          gap: 2rem;
        }
        
        .profile-photo {
          margin: 0 auto;
        }
        
        .projects-grid {
          grid-template-columns: 1fr;
        }
        
        .experience-item {
          grid-template-columns: 1fr;
          gap: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
