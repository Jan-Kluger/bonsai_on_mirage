<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Yannick Schürmann</title>
    <script defer src="/main.bc.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      
      body {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 1.1rem;
        line-height: 1.75;
        background: #0a0a0b;
        min-height: 100vh;
        color: #e4e4e7;
        padding: 0 max(2rem, calc((100vw - 800px) / 2));
      }
      
      h1 {
        font-size: 3.5rem;
        font-weight: 600;
        margin: 0 0 1.5rem 0;
        color: #fafafa;
        letter-spacing: -0.02em;
      }
      
      h2 {
        font-size: 1.5rem;
        font-weight: 600;
        color: #fafafa;
        margin-top: 3rem;
        margin-bottom: 1rem;
      }
      
      h3 {
        font-size: 1.25rem;
        font-weight: 500;
        color: #fafafa;
      }
      
      p {
        color: #a1a1aa;
        max-width: 60ch;
      }
      
      a {
        color: #3b82f6;
        text-decoration: none;
        transition: color 0.15s ease;
      }
      
      a:hover {
        color: #60a5fa;
      }
      
      ul.nav {
        list-style: none;
        display: flex;
        gap: 0.5rem;
        margin-top: 2rem;
      }
      
      ul.nav li a {
        font-family: 'DM Mono', monospace;
        font-size: 0.85rem;
        color: #a1a1aa;
        padding: 0.5rem 1rem;
        border-radius: 6px;
        background: #18181b;
        border: 1px solid #27272a;
        transition: all 0.15s ease;
      }
      
      ul.nav li a:hover {
        background: #27272a;
        color: #fafafa;
        border-color: #3f3f46;
      }
      
      .hero {
        padding: 6rem 0 4rem 0;
        border-bottom: 1px solid #27272a;
      }
      
      .hero p {
        font-size: 1.25rem;
        color: #71717a;
      }
      
      .content {
        padding: 2rem 0 4rem 0;
      }
      
      .back-btn {
        font-family: 'DM Mono', monospace;
        font-size: 0.85rem;
        background: #18181b;
        color: #a1a1aa;
        border: 1px solid #27272a;
        padding: 0.5rem 1rem;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.15s ease;
        margin-bottom: 2rem;
      }
      
      .back-btn:hover {
        background: #27272a;
        color: #fafafa;
        border-color: #3f3f46;
      }
      
      .project-card {
        background: #18181b;
        border: 1px solid #27272a;
        border-radius: 12px;
        padding: 1.5rem;
        margin-top: 1.5rem;
        cursor: pointer;
        transition: all 0.2s ease;
        max-width: 400px;
      }
      
      .project-card:hover {
        background: #1f1f23;
        border-color: #3f3f46;
        transform: translateY(-2px);
      }
      
      .project-card h3 {
        margin-bottom: 0.5rem;
      }
      
      .project-card p {
        font-size: 0.95rem;
        color: #71717a;
        margin: 0;
      }
      
      .tech-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        margin-top: 1rem;
      }
      
      .tech-list li {
        font-family: 'DM Mono', monospace;
        font-size: 0.9rem;
        color: #3b82f6;
        padding: 0.5rem 0.75rem;
        background: rgba(59, 130, 246, 0.1);
        border-radius: 6px;
        width: fit-content;
      }

      @media (max-width: 640px) {
        body {
          padding: 0 1.5rem;
        }
        
        h1 {
          font-size: 2.5rem;
        }
        
        .hero {
          padding: 4rem 0 3rem 0;
        }
        
        ul.nav {
          flex-wrap: wrap;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
